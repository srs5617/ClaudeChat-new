name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Flutter iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Build and package unsigned IPA
        run: bash ./build-ios-unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeChat-ios-unsigned
          path: |
            ClaudeChat-ios-unsigned.ipa
            build/ios/ipa/unsigned-ipa-manifest.txt
          if-no-files-found: error
          retention-days: 14
